<!doctype html>

<html>
  <head>
    <title>StereoPi Camera</title>

    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #111111;
        color: #00ff00;
        font-family: monospace;
      }

      .container {
        display: flex;
        gap: 20px;
      }

      .camera {
        flex: 1;
      }

      .title {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .camera img {
        width: 100%;
        display: block;
        background: #111111;
        border: 2px solid #00ff00;
        border-radius: 8px;
        box-sizing: border-box;
      }

      .stats {
        margin-top: 10px;
        line-height: 1.6;
        font-size: 15px;
      }

      .common {
        margin-top: 20px;
        padding: 15px;
        border: 2px solid #00ff00;
        border-radius: 8px;
        line-height: 1.6;
        font-size: 15px;
      }

      .sync {
        font-weight: bold;
      }

      .sync.in-sync {
        color: #00ff00;
      }

      .sync.not-in-sync {
        color: #ff0000;
      }

      .pair {
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="camera">
        <div class="title">L</div>

        <img id="left" />

        <div class="stats">
          <div id="left_stats">Waiting...</div>
          <div id="left_pair">Pair: --</div>
          <div id="left_timestamp">Timestamp: --</div>
        </div>
      </div>

      <div class="camera">
        <div class="title">R</div>

        <img id="right" />

        <div class="stats">
          <div id="right_stats">Waiting...</div>
          <div id="right_pair">Pair: --</div>
          <div id="right_timestamp">Timestamp: --</div>
        </div>
      </div>
    </div>

    <div class="common">
      <div id="sync_status" class="sync">
        Stereo Sync: Waiting...
      </div>

      <div id="sync_difference">
        Timestamp Difference: --
      </div>

      <div id="pair_status" class="pair">
        Pair: --
      </div>
    </div>

    <script>
      const leftImage =
        document.getElementById("left");

      const rightImage =
        document.getElementById("right");

      const leftStats =
        document.getElementById("left_stats");

      const rightStats =
        document.getElementById("right_stats");

      const leftPair =
        document.getElementById("left_pair");

      const rightPair =
        document.getElementById("right_pair");

      const leftTimestamp =
        document.getElementById("left_timestamp");

      const rightTimestamp =
        document.getElementById("right_timestamp");

      const syncStatus =
        document.getElementById("sync_status");

      const syncDifference =
        document.getElementById("sync_difference");

      const pairStatus =
        document.getElementById("pair_status");


      /*
       * Maximum acceptable difference between
       * left and right capture timestamps.
       *
       * 1 ms = 1,000,000 ns
       */
      const SYNC_THRESHOLD_NS = 1_000_000n;


      let leftPairID = null;
      let rightPairID = null;

      let leftTimestampValue = null;
      let rightTimestampValue = null;


      function updateSyncStatus() {
        /*
         * We need both frames before checking
         * stereo synchronization.
         */
        if (
          leftPairID === null ||
          rightPairID === null ||
          leftTimestampValue === null ||
          rightTimestampValue === null
        ) {
          syncStatus.textContent =
            "Stereo Sync: Waiting...";

          syncStatus.className = "sync";

          syncDifference.textContent =
            "Timestamp Difference: --";

          pairStatus.textContent =
            "Pair: --";

          return;
        }


        /*
         * First verify that the two images
         * belong to the same stereo pair.
         */
        if (leftPairID !== rightPairID) {
          syncStatus.textContent =
            "Stereo Sync: PAIR MISMATCH";

          syncStatus.className =
            "sync not-in-sync";

          syncDifference.textContent =
            "Timestamp Difference: --";

          pairStatus.textContent =
            "Pair Mismatch: L=" +
            leftPairID.toString() +
            " R=" +
            rightPairID.toString();

          return;
        }


        /*
         * Calculate absolute timestamp difference.
         */
        const difference =
          leftTimestampValue > rightTimestampValue
            ? leftTimestampValue - rightTimestampValue
            : rightTimestampValue - leftTimestampValue;


        const differenceMs =
          Number(difference) / 1_000_000;


        const inSync =
          difference <= SYNC_THRESHOLD_NS;


        if (inSync) {
          syncStatus.textContent =
            "Stereo Sync: IN SYNC";

          syncStatus.className =
            "sync in-sync";
        } else {
          syncStatus.textContent =
            "Stereo Sync: NOT IN SYNC";

          syncStatus.className =
            "sync not-in-sync";
        }


        syncDifference.textContent =
          "Timestamp Difference: " +
          differenceMs.toFixed(3) +
          " ms";


        pairStatus.textContent =
          "Pair: " +
          leftPairID.toString();
      }


      const socket = new WebSocket(
        "ws://" + location.host + "/stream"
      );


      socket.binaryType = "arraybuffer";


      socket.onmessage = (event) => {

        /*
         * Text messages contain statistics.
         */
        if (typeof event.data === "string") {

          const data = JSON.parse(event.data);


          const leftMbps =
            data.left.transfer;

          const rightMbps =
            data.right.transfer;


          const leftMBps =
            leftMbps / 8;

          const rightMBps =
            rightMbps / 8;


          leftStats.innerHTML =
            "FPS: " +
            data.left.fps.toFixed(1) +
            "<br>" +
            "Transfer: " +
            leftMbps.toFixed(2) +
            " Mbps (" +
            leftMBps.toFixed(2) +
            " MBps)";


          rightStats.innerHTML =
            "FPS: " +
            data.right.fps.toFixed(1) +
            "<br>" +
            "Transfer: " +
            rightMbps.toFixed(2) +
            " Mbps (" +
            rightMBps.toFixed(2) +
            " MBps)";


          return;
        }


        /*
         * Binary frame format from Go:
         *
         * byte  0      = camera ID
         * bytes 1-8    = pair ID
         * bytes 9-16   = timestamp
         * bytes 17-N   = JPEG
         */


        const bytes =
          new Uint8Array(event.data);


        /*
         * Camera ID:
         *
         * 0 = left
         * 1 = right
         */
        const camera =
          bytes[0];


        /*
         * Pair ID.
         */
        const pairID =
          new DataView(
            event.data,
            1,
            8
          ).getBigUint64(0);


        /*
         * Capture timestamp.
         */
        const timestamp =
          new DataView(
            event.data,
            9,
            8
          ).getBigUint64(0);


        /*
         * JPEG begins at byte 17.
         */
        const jpeg =
          bytes.slice(17);


        const blob =
          new Blob(
            [jpeg],
            {
              type: "image/jpeg",
            }
          );


        const url =
          URL.createObjectURL(blob);


        /*
         * LEFT CAMERA
         */
        if (camera === 0) {

          const old =
            leftImage.src;


          leftImage.src =
            url;


          if (old.startsWith("blob:")) {
            URL.revokeObjectURL(old);
          }


          leftPairID =
            pairID;

          leftTimestampValue =
            timestamp;


          leftPair.textContent =
            "Pair: " +
            pairID.toString();


          leftTimestamp.textContent =
            "Timestamp: " +
            timestamp.toString();

        }


        /*
         * RIGHT CAMERA
         */
        else if (camera === 1) {

          const old =
            rightImage.src;


          rightImage.src =
            url;


          if (old.startsWith("blob:")) {
            URL.revokeObjectURL(old);
          }


          rightPairID =
            pairID;

          rightTimestampValue =
            timestamp;


          rightPair.textContent =
            "Pair: " +
            pairID.toString();


          rightTimestamp.textContent =
            "Timestamp: " +
            timestamp.toString();
        }


        /*
         * Check synchronization after
         * receiving either camera frame.
         */
        updateSyncStatus();
      };


      socket.onclose = () => {

        leftStats.textContent =
          "WebSocket disconnected";

        rightStats.textContent =
          "WebSocket disconnected";


        leftPair.textContent =
          "Pair: --";

        rightPair.textContent =
          "Pair: --";


        leftTimestamp.textContent =
          "Timestamp: --";

        rightTimestamp.textContent =
          "Timestamp: --";


        syncStatus.textContent =
          "Stereo Sync: Disconnected";

        syncStatus.className =
          "sync";


        syncDifference.textContent =
          "Timestamp Difference: --";


        pairStatus.textContent =
          "Pair: --";


        leftPairID = null;
        rightPairID = null;

        leftTimestampValue = null;
        rightTimestampValue = null;
      };
    </script>
  </body>
</html>
